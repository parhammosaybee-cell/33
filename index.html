<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PM Chat — چت عمومی</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:#edf5ff;color:#163453}.wrap{max-width:900px;height:100dvh;min-height:520px;margin:auto;background:#fff;display:flex;flex-direction:column;box-shadow:0 8px 35px #17416b18}.head{background:#147df5;color:white;padding:15px 18px;display:flex;align-items:center;gap:12px}.logo{background:#fff;color:#147df5;font-weight:bold;border-radius:14px;padding:11px;font-size:18px}.head h1{font-size:19px;margin:0}.head p{font-size:12px;margin:5px 0 0;opacity:.9}.status{margin-right:auto;font-size:12px}.profilebar{padding:12px 16px;background:#f7fbff;border-bottom:1px solid #e4eef8;display:flex;align-items:center;gap:12px}.avatar{width:48px;height:48px;border-radius:50%;background:#dceeff;color:#147df5;display:grid;place-items:center;font-weight:bold;overflow:hidden;flex-shrink:0;border:2px solid #c3e0ff}.avatar img,.msgavatar img{width:100%;height:100%;object-fit:cover}.profiletext{min-width:0;flex:1}.profiletext b{font-size:13px}.profiletext small{display:block;color:#7790aa;margin-top:4px}.btn{border:0;border-radius:10px;background:#e2efff;color:#1268c9;padding:10px 12px;font:12px Tahoma;cursor:pointer}.nameinput{padding:10px 14px;display:flex;gap:8px;border-bottom:1px solid #e4eef8}.nameinput input{min-width:0;flex:1;border:1px solid #dce8f4;border-radius:10px;padding:10px;font:inherit}.messages{flex:1;overflow-y:auto;padding:18px;display:flex;flex-direction:column;gap:12px;background-color:#f3f9ff;background-image:radial-gradient(#dbeafa 1px,transparent 1px);background-size:18px 18px}.msgrow{display:flex;gap:8px;align-items:flex-end;align-self:flex-start;max-width:90%}.msgavatar{width:31px;height:31px;flex-shrink:0;border-radius:50%;background:#dceeff;color:#147df5;display:grid;place-items:center;font-size:11px;font-weight:bold;overflow:hidden}.msg{background:white;border:1px solid #e4edf7;border-radius:14px 14px 14px 4px;padding:10px 13px;box-shadow:0 2px 6px #193f6510;overflow-wrap:anywhere}.who{font-size:12px;color:#147df5;font-weight:bold;margin-bottom:5px}.body{font-size:14px;line-height:1.8;white-space:pre-wrap}.time{font-size:10px;color:#8198b2;text-align:left;margin-top:4px}.system{align-self:center;background:#e3effc;color:#66829f;font-size:11px;padding:6px 12px;border-radius:20px}.compose{padding:13px;display:flex;gap:9px;border-top:1px solid #e3edf7}.compose input{flex:1;min-width:0;border:1px solid #dce8f4;border-radius:13px;padding:13px;font:inherit;outline-color:#147df5}.compose button{border:0;border-radius:13px;padding:0 19px;background:#147df5;color:white;font:inherit;cursor:pointer}.foot{text-align:center;font-size:10px;color:#91a2b5;padding:0 8px 8px}#file{display:none}@media(max-width:600px){.msgrow{max-width:98%}.head{padding:13px}.compose{padding:9px}.compose button{padding:0 13px}.profilebar{padding:10px}}
</style></head><body><main class="wrap">
<header class="head"><div class="logo">PM</div><div><h1>PM Chat · چت عمومی</h1><p>گفت‌وگو با همهٔ کاربران</p></div><div class="status" id="status">در حال اتصال…</div></header>
<div class="profilebar"><div class="avatar" id="avatar">PM</div><div class="profiletext"><b id="displayName">کاربر</b><small>عکس پروفایل و نام نمایشی</small></div><button class="btn" id="changePhoto">تعویض عکس</button><input id="file" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></div>
<div class="nameinput"><input id="username" maxlength="24" placeholder="نام نمایشی‌ات را بنویس" value="کاربر"><button class="btn" id="saveName">ثبت نام</button></div>
<section class="messages" id="messages"><div class="system">در حال اتصال به چت عمومی…</div></section>
<form class="compose" id="form"><input id="text" maxlength="1000" placeholder="پیامت را بنویس…" autocomplete="off"><button type="submit">ارسال ➤</button></form><div class="foot">PM Chat · نمونهٔ چت عمومی</div>
</main><script>
const msgs=document.getElementById('messages'),statusEl=document.getElementById('status'),nameEl=document.getElementById('username'),textEl=document.getElementById('text'),avatarEl=document.getElementById('avatar'),displayName=document.getElementById('displayName'),fileEl=document.getElementById('file');
let socket,retry=1000,avatarUrl=localStorage.getItem('pmchat-avatar')||'',name=localStorage.getItem('pmchat-name')||'کاربر';
nameEl.value=name;function paintAvatar(el,url,n){el.innerHTML='';if(url){const img=document.createElement('img');img.src=url;el.appendChild(img)}else el.textContent=(n||'PM').slice(0,2).toUpperCase()}
function refreshProfile(){name=nameEl.value.trim()||'کاربر';displayName.textContent=name;paintAvatar(avatarEl,avatarUrl,name);localStorage.setItem('pmchat-name',name)}
refreshProfile();document.getElementById('saveName').onclick=()=>{refreshProfile();};
document.getElementById('changePhoto').onclick=()=>fileEl.click();
fileEl.onchange=async()=>{const file=fileEl.files[0];if(!file)return;if(file.size>3*1024*1024){alert('حجم عکس باید کمتر از ۳ مگابایت باشد.');fileEl.value='';return}refreshProfile();const fd=new FormData();fd.append('username',name);fd.append('avatar',file);try{const r=await fetch('/api/profile',{method:'POST',body:fd});const d=await r.json();if(!r.ok)throw new Error(d.detail||'بارگذاری عکس ناموفق بود');avatarUrl=d.avatar;localStorage.setItem('pmchat-avatar',avatarUrl);paintAvatar(avatarEl,avatarUrl,name);alert('عکس پروفایل تغییر کرد.');}catch(e){alert('تعویض عکس انجام نشد: '+e.message)}};
function addMessage(m){const row=document.createElement('div');row.className='msgrow';const av=document.createElement('div');av.className='msgavatar';paintAvatar(av,m.avatar,m.username);const box=document.createElement('article');box.className='msg';const who=document.createElement('div');who.className='who';who.textContent=m.username||'کاربر';const body=document.createElement('div');body.className='body';body.textContent=m.text||'';const time=document.createElement('div');time.className='time';time.textContent=m.created_at||'';box.append(who,body,time);row.append(av,box);msgs.appendChild(row);while(msgs.children.length>250)msgs.firstChild.remove();msgs.scrollTop=msgs.scrollHeight}
function connect(){const proto=location.protocol==='https:'?'wss':'ws';socket=new WebSocket(`${proto}://${location.host}/ws`);socket.onopen=()=>{statusEl.textContent='● متصل';statusEl.style.color='#b8ffd5';retry=1000};socket.onmessage=e=>{const d=JSON.parse(e.data);if(d.type==='history'){msgs.innerHTML='';if(!d.messages.length){const s=document.createElement('div');s.className='system';s.textContent='هنوز پیامی نیست؛ اولین پیام را بفرست!';msgs.appendChild(s)}d.messages.forEach(addMessage)}else if(d.type==='message'){if(msgs.querySelector('.system'))msgs.innerHTML='';addMessage(d)}};socket.onclose=()=>{statusEl.textContent='قطع شد؛ تلاش دوباره…';statusEl.style.color='#ffe2a8';setTimeout(connect,retry);retry=Math.min(retry*2,10000)};socket.onerror=()=>socket.close()}
connect();document.getElementById('form').addEventListener('submit',e=>{e.preventDefault();refreshProfile();const text=textEl.value.trim();if(!text)return;if(!socket||socket.readyState!==WebSocket.OPEN){alert('اتصال برقرار نیست؛ چند لحظه صبر کن.');return}socket.send(JSON.stringify({username:name,text}));textEl.value='';textEl.focus()});
</script></body></html>
